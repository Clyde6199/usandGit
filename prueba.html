<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <style>
      body
      {   
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #4ca1af;
            margin: 0;
        }
        .contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 250px;
        }
        .tarjeta img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
        .tarjeta h3 {
            margin: 10px 0;
            font-size: 1.2em;
        }
        .tarjeta p {
            font-size: 0.9em;
            color: #666;
        }
        .tarjeta button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .tarjeta button:hover {
            background: #0056b3;
        }

        body {
            font-family: Arial, sans-serif;
        }
        h2 {
            font-weight: bold;
            text-align: center;
        }
        ul {
            list-style-type: square; 
            padding-left: 20px;
        }
    </style> 
</head>
