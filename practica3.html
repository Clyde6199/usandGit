<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {   
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }
        .contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .tarjeta {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 250px;
        }
        .tarjeta img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
        .tarjeta h3 {
            margin: 10px 0;
            font-size: 1.2em;
        }
        .tarjeta p {
            font-size: 0.9em;
            color: #666;
        }
        .tarjeta button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .tarjeta button:hover {
            background: #0056b3;
        }
    </style> 
</head>
<body>
    <link rel="stylesheet" href="ejemplo.css"
    <div class="contenedor">
        <div class="tarjeta">
            <img src="https://i.pinimg.com/736x/ef/23/3c/ef233c2196badef3d2c9a2133bf05be8.jpg" alt="Perfil">
            <h3>Balgañon Duran Jairo Amed</h3>
            <p>Desarrollador en paginas web 
            </portal>.</p>
            <button><a href="#">Ver perfil</a></button> 


        </div>
    </div>
</body>
</html>
